services:
  postgres:
    image: postgres:16-alpine
    container_name: leadflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
      POSTGRES_DB: leadflow
    ports:
      - '5432:5432'
    volumes:
      - leadflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadflow -d leadflow']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: leadflow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://leadflow:leadflow@postgres:5432/leadflow?schema=public
      PORT: '4000'
      WEB_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: leadflow-web
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5173 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  leadflow-postgres-data:
